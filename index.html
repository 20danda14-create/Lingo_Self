<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Türkçe Lingo Oyunu (TDK Uyumlu)</title>
    <style>
        :root {
            --correct-color: #2ecc71;
            --present-color: #f1c40f;
            --absent-color: #7f8c8d;
            --bg-color: #1a1a1a;
            --card-bg: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 5px;
            color: #e74c3c;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #bdc3c7;
            margin-bottom: 20px;
        }

        .setup-container {
            margin-bottom: 25px;
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            gap: 15px;
            align-items: center;
        }

        select, button {
            padding: 10px 15px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        select {
            background-color: #ffffff;
            color: #333;
        }

        button {
            background-color: #e74c3c;
            color: white;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #c0392b;
        }

        .game-board {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 25px;
            cursor: pointer;
        }

        .row {
            display: flex;
            gap: 8px;
        }

        .cell {
            width: 55px;
            height: 55px;
            border: 2px solid #455a64;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.2s ease;
            background-color: transparent;
        }

        .cell.correct {
            background-color: var(--correct-color) !important;
            border-color: var(--correct-color) !important;
        }

        .cell.present {
            background-color: var(--present-color) !important;
            border-color: var(--present-color) !important;
        }

        .cell.absent {
            background-color: var(--absent-color) !important;
            border-color: var(--absent-color) !important;
        }

        .message {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 15px;
            min-height: 30px;
            text-align: center;
        }

        /* Klavye odağını kaybetmemek için görünmez input */
        #hidden-input {
            position: absolute;
            opacity: 0;
            top: -100px;
            left: -100px;
            width: 1px;
            height: 1px;
        }
    </style>
</head>
<body>

    <h1>Lingo</h1>
    <div class="subtitle">sozluk.gov.tr Tabanlı Kelime Oyunu</div>

    <div class="setup-container">
        <label for="word-length">Kelime Uzunluğu:</label>
        <select id="word-length">
            <option value="4">4 Harfli</option>
            <option value="5" selected>5 Harfli</option>
            <option value="6">6 Harfli</option>
            <option value="7">7 Harfli</option>
        </select>
        <button onclick="initGame()">Yeni Oyun Başlat</button>
    </div>

    <input type="text" id="hidden-input" autocomplete="off" autofocus>

    <div class="game-board" id="board" onclick="focusInput()"></div>
    <div class="message" id="message-display"></div>
