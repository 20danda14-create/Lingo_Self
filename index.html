<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Türkçe Lingo Oyunu (Yarışma Modu)</title>
    <style>
        :root {
            --correct-color: #2ecc71;
            --present-color: #f1c40f;
            --absent-color: #7f8c8d;
            --bg-color: #1a1a1a;
            --card-bg: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: #ffffff;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            margin: 5px 0 0 0;
            color: #e74c3c;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 2rem;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #bdc3c7;
            margin-bottom: 10px;
        }

        .status-container {
            margin-bottom: 15px;
            background: var(--card-bg);
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            gap: 20px;
            align-items: center;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .status-item {
            background: rgba(0,0,0,0.2);
            padding: 5px 12px;
            border-radius: 4px;
        }

        button {
            padding: 8px 15px;
            font-size: 0.95rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            background-color: #e74c3c;
            color: white;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #c0392b;
        }

        button:disabled {
            background-color: #34495e;
            color: #7f8c8d;
            cursor: not-allowed;
        }

        .game-board {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 15px;
        }

        .row {
            display: flex;
            gap: 6px;
        }

        .cell {
            width: 48px;
            height: 48px;
            border: 2px solid #455a64;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.2s ease;
            background-color: transparent;
        }

        .cell.correct {
            background-color: var(--correct-color) !important;
            border-color: var(--correct-color) !important;
        }

        .cell.present {
            background-color: var(--present-color) !important;
            border-color: var(--present-color) !important;
        }

        .cell.absent {
            background-color: var(--absent-color) !important;
            border-color: var(--absent-color) !important;
        }

        .message {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            min-height: 25px;
            text-align: center;
            max-width: 90%;
        }

        .keyboard {
            display: flex;
            flex-direction: column;
            gap: 3px;
            width: 100%;
            max-width: 500px;
            margin-top: auto;
            padding-bottom: 10px;
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 4px;
            width: 100%;
        }

        .key {
            background-color: #455a64;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 14px 0;
            flex: 1;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            text-align: center;
            text-transform: uppercase;
            touch-action: manipulation;
        }

        .key:active, .key:hover {
            background-color: #546e7a;
        }

        .key.wide {
            flex: 1.8;
            font-size: 0.9rem;
            background-color: #7f8c8d;
        }
    </style>
</head>
<body>

    </div>

    <div class="game-board" id="board"></div>
