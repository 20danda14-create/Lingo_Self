<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Türkçe Lingo Oyunu (TDK Uyumlu)</title>
    <style>
        :root {
            --correct-color: #2ecc71;
            --present-color: #f1c40f;
            --absent-color: #7f8c8d;
            --bg-color: #1a1a1a;
            --card-bg: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: #ffffff;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            margin: 5px 0 0 0;
            color: #e74c3c;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 2rem;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #bdc3c7;
            margin-bottom: 15px;
        }

        .setup-container {
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        select, button {
            padding: 8px 12px;
            font-size: 0.95rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        select {
            background-color: #ffffff;
            color: #333;
        }

        button {
            background-color: #e74c3c;
            color: white;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #c0392b;
        }

        .game-board {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 15px;
        }

        .row {
            display: flex;
            gap: 6px;
        }

        .cell {
            width: 48px;
            height: 48px;
            border: 2px solid #455a64;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.2s ease;
            background-color: transparent;
        }

        .cell.correct {
            background-color: var(--correct-color) !important;
            border-color: var(--correct-color) !important;
        }

        .cell.present {
            background-color: var(--present-color) !important;
            border-color: var(--present-color) !important;
        }

        .cell.absent {
            background-color: var(--absent-color) !important;
            border-color: var(--absent-color) !important;
        }

        .message {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
            min-height: 25px;
            text-align: center;
        }

        /* Mobil ve Masaüstü için Ekran Klavyesi */
        .keyboard {
            display: flex;
            flex-direction: column;
            gap: 3px;
            width: 100%;
            max-width: 500px;
            margin-top: auto;
            padding-bottom: 10px;
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 4px;
            width: 100%;
        }

        .key {
            background-color: #455a64;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 14px 0;
            flex: 1;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            text-align: center;
            text-transform: uppercase;
            touch-action: manipulation;
        }

        .key:active, .key:hover {
            background-color: #546e7a;
        }

        .key.wide {
            flex: 1.8;
            font-size: 0.9rem;
            background-color: #7f8c8d;
        }
    </style>
</head>
<body>

    <h1>Lingo</h1>
    <div class="subtitle">sozluk.gov.tr Tabanlı Kelime Oyunu</div>

    <div class="setup-container">
        <select id="word-length">
            <option value="4">4 Harf</option>
            <option value="5" selected>5 Harf</option>
            <option value="6">6 Harf</option>
            <option value="7">7 Harf</option>
        </select>
        <button onclick="initGame()">Yeni Oyun</button>
    </div>

    <div class="game-board" id="board"></div>
    <div class="message" id="message-display"></div>

    <div class="keyboard">
        <div class="keyboard-row">
            <button class="key" onclick="handleInput('E')">E</button>
            <button class="key" onclick="handleInput('R')">R</button>
            <button class="key" onclick="handleInput('T')">T</button>
            <button class="key" onclick="handleInput('Y')">Y</button>
            <button class="key" onclick="handleInput('U')">U</button>
            <button class="key" onclick="handleInput('I')">I</button>
            <button class="key" onclick="handleInput('İ')">İ</button>
            <button class="key" onclick="handleInput('O')">O</button>
            <button class="key" onclick="handleInput('Ö')">Ö</button>
            <button class="key" onclick="handleInput('P')">P</button>
        </div>
        <div class="keyboard-row">
            <button class="key" onclick="handleInput('A')">A</button>
            <button class="key" onclick="maxAttempts">S</button>
            <button class="key" onclick="handleInput('S')">S</button>
            <button class="key" onclick="handleInput('D')">D</button>
            <button class="key" onclick="handleInput('F')">F</button>
            <button class="key" onclick="handleInput('G')">G</button>
            <button class="key" onclick="handleInput('Ğ')">Ğ</button>
            <button class="key" onclick="handleInput('H')">H</button>
            <button class="key" onclick="handleInput('J')">J</button>
            <button class="key" onclick="handleInput('K')">K</button>
            <button class="key" onclick="handleInput('L')">L</button>
            <button class="key" onclick="handleInput('Ş')">Ş</button>
        </div>
        <div class="keyboard-row">
            <button class="key wide" onclick="handleInput('ENTER')">ENTER</button>
            <button class="key" onclick="handleInput('Z')">Z</button>
            <button class="key" onclick="handleInput('X')">X</button>
            <button class="key" onclick="handleInput('C')">C</button>
            <button class="key" onclick="handleInput('Ç')">Ç</button>
            <button class="key" onclick="handleInput('V')">V</button>
            <button class="key" onclick="handleInput('B')">B</button>
            <button class="key" onclick="handleInput('N')">N</button>
            <button class="key" onclick="handleInput('M')">M</button>
            <button class="key" onclick="handleInput('Ü')">Ü</button>
            <button class="key wide" onclick="handleInput('BACKSPACE')">SİL</button>
        </div>
    </div>

    <script>
        const wordPool = {
            4: ["ANIT", "ACAR", "BATI", "DOĞU", "KALE", "YURT", "KURT", "YAZI", "KATI", "İLKE", "ÜLKE", "ALÇI", "ADIM", "AŞÇI", "AFİŞ", "AŞIK", "BAKİ", "BLOK", "CİLA", "ÇAPA", "DERE", "EKİN", "GIDA", "İDOL", "İMGE", "İVME", "KREM", "LİSE", "MART", "OCAK", "ÖYKÜ", "RANT", "SARI", "TAHT", "UZAY", "VALE", "VETO"],
            5: ["KALEM", "KAVUN", "YAZAR", "MİRAS", "KİTAP", "DENİZ", "DÜNYA", "GÜNEŞ", "BAHAR", "KUMAL", "EFKÂR", "TUTKU", "ZAMAN", "CEVİZ", "DAİRE", "EMLAK", "FESİH", "LİMAN", "KRAVAT", "MANTİ", "NİMET", "OTİZM", "RADYO", "SEHPA", "TAVŞA", "SİREN", "EKSEN", "İSKAN", "İRONİ", "İNCİR", "İZMİR", "İPTAL", "İSRAF", "MESAİ", "SİVRİ", "BİBER", "KİLİM", "MİKRO"],
            6: ["BELLEK", "KÜLTÜR", "TÜRKÇE", "MİLLET", "GAYRET", "HAZİNE", "SANATÇI", "YAZILM", "SİSTEM", "ADALET", "TENEKE", "VİCDAN", "SÖZLÜK", "GÖZLÜK", "KIVRAM", "REHBER", "MİMARİ", "SİGORT", "TAYYAR", "TİYATR", "BEYAZT", "KAFTER", "İSTİFA", "İHANET", "İLETKİ", "MİTRAL", "BİRİNC", "DİREKT", "İŞLEMC"],
            7: ["SÖZCÜKL", "SÖZLÜKÇ", "KAPANIŞ", "MİMARLİ", "KILAVUZ", "ANADOLU", "AKADEMİ", "BELGELİ", "YETENEK", "FELSEFE", "BAŞARIL", "İSTİSNA", "İKTİSAT", "İLETİŞİ", "MİLLİYET", "ZANAATÇ", "ÇELİŞKİ", "BELGESE", "DİNAMİK", "İSTİKBA", "BİLMEC", "DİPLOMA", "ÖZGÜRLÜ"]
        };

        let secretWord = "";
        let wordLength = 5;
        const maxAttempts = 5;
        let currentAttempt = 0;
        let currentGuess = "";
        let gameOver = false;

        const board = document.getElementById("board");
        const messageDisplay = document.getElementById("message-display");

        function turkceBuyut(text) {
            let herfMap = { 'i': 'İ', 'ş': 'Ş', 'ğ': 'Ğ', 'ç': 'Ç', 'ı': 'I', 'ö': 'Ö', 'ü': 'Ü' };
            return text.split('').map(char => herfMap[char] || char.toUpperCase()).join('');
        }

        function initGame() {
            wordLength = parseInt(document.getElementById("word-length").value);
            const pool = wordPool[wordLength];
            secretWord = pool[Math.floor(Math.random() * pool.length)];
            
            currentAttempt = 0;
            currentGuess = "";
            gameOver = false;
            messageDisplay.innerText = "";
            
            buildBoard();
        }

        function buildBoard() {
            board.innerHTML = "";
            for (let i = 0; i < maxAttempts; i++) {
                const row = document.createElement("div");
                row.className = "row";
                for (let j = 0; j < wordLength; j++) {
                    const cell = document.createElement("div");
                    cell.className = "cell";
                    cell.id = `cell-${i}-${j}`;
                    
                    // Lingo: Sadece ilk satırın ilk hücresinde oyun başında ipucu harfi görünür
                    if (i === 0 && j === 0) {
                        cell.innerText = secretWord[0];
                        cell.style.color = "#7f8c8d";
                    }
                    row.appendChild(cell);
                }
                board.appendChild(row);
            }
        }

        // Ortak Giriş Yöneticisi (Hem ekrandaki hem fiziksel klavyeyi kontrol eder)
        function handleInput(input) {
            if (gameOver) return;

            if (input === "ENTER") {
                if (currentGuess.length === wordLength) {
                    checkGuess();
                } else {
                    showMessage(`Lütfen ${wordLength} harfli bir kelime girin!`, "#e74c3c");
                }
            } else if (input === "BACKSPACE") {
                currentGuess = currentGuess.slice(0, -1);
                updateRowDisplay();
            } else if (currentGuess.length < wordLength && input.length === 1) {
                currentGuess += input;
                updateRowDisplay();
            }
        }

        // Bilgisayardan oynayanlar için fiziksel klavye dinleyicisi
        window.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                handleInput("ENTER");
            } else if (e.key === "Backspace") {
                handleInput("BACKSPACE");
            } else {
                let keyChar = e.key;
                if (keyChar.length === 1 && /[a-zA-ZçğıiöşüÇĞIİÖŞÜ]/.test(keyChar)) {
                    handleInput(turkceBuyut(keyChar));
                }
            }
        });

        function updateRowDisplay() {
            for (let j = 0; j < wordLength; j++) {
                const cell = document.getElementById(`cell-${currentAttempt}-${j}`);
                
                if (j < currentGuess.length) {
                    cell.innerText = currentGuess[j];
                    cell.style.color = "#ffffff";
                } else if (j === 0) {
                    cell.innerText = secretWord[0];
                    cell.style.color = "#7f8c8d";
                } else {
                    cell.innerText = "";
                }
            }
        }

        function checkGuess() {
            const secretLetterCount = {};
            for (let char of secretWord) {
                secretLetterCount[char] = (secretLetterCount[char] || 0) + 1;
            }

            const rowStatus = new Array(wordLength).fill("absent");

            // Yeşiller
            for (let i = 0; i < wordLength; i++) {
                if (currentGuess[i] === secretWord[i]) {
                    rowStatus[i] = "correct";
                    secretLetterCount[currentGuess[i]]--;
                }
            }

            // Sarılar
            for (let i = 0; i < wordLength; i++) {
                if (rowStatus[i] !== "correct") {
                    if (secretLetterCount[currentGuess[i]] > 0) {
                        rowStatus[i] = "present";
                        secretLetterCount[currentGuess[i]]--;
                    }
                }
            }

            // Arayüze uygula
            for (let i = 0; i < wordLength; i++) {
                const cell = document.getElementById(`cell-${currentAttempt}-${i}`);
                cell.innerText = currentGuess[i];
                cell.style.color = "#ffffff";
                cell.classList.add(rowStatus[i]);
            }

            // Oyun bitti mi?
            if (currentGuess === secretWord) {
                showMessage("Tebrikler! Kelimeyi bildiniz. 🎉", "#2ecc71");
                gameOver = true;
            } else {
                currentAttempt++;
                currentGuess = "";
                
                if (currentAttempt >= maxAttempts) {
                    showMessage(`Bilemediniz! Doğru Kelime: ${secretWord}`, "#e74c3c");
                    gameOver = true;
                } else {
                    // Lingo Kuralı: Yeni satıra geçildiğinde sadece o satırın başına ilk harf gelir
                    const nextFirstCell = document.getElementById(`cell-${currentAttempt}-0`);
                    nextFirstCell.innerText = secretWord[0];
                    nextFirstCell.style.color = "#7f8c8d";
                }
            }
        }

        function showMessage(msg, color) {
            messageDisplay.innerText = msg;
            messageDisplay.style.color = color;
        }

        window.onload = initGame;
    </script>
</body>
</html>
