<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Türkçe Lingo Oyunu (Yarışma Modu)</title>
    <style>
        :root {
            --correct-color: #2ecc71;
            --present-color: #f1c40f;
            --absent-color: #7f8c8d;
            --bg-color: #1a1a1a;
            --card-bg: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: #ffffff;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            margin: 5px 0 0 0;
            color: #e74c3c;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 2rem;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #bdc3c7;
            margin-bottom: 10px;
        }

        .status-container {
            margin-bottom: 15px;
            background: var(--card-bg);
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            gap: 20px;
            align-items: center;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .status-item {
            background: rgba(0,0,0,0.2);
            padding: 5px 12px;
            border-radius: 4px;
        }

        button {
            padding: 8px 15px;
            font-size: 0.95rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            background-color: #e74c3c;
            color: white;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #c0392b;
        }

        button:disabled {
            background-color: #34495e;
            color: #7f8c8d;
            cursor: not-allowed;
        }

        .game-board {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 15px;
            min-height: 270px; /* Grid'in yüklenirken kaymasını engeller */
        }

        .row {
            display: flex;
            gap: 6px;
            justify-content: center;
        }

        .cell {
            width: 48px;
            height: 48px;
            border: 2px solid #455a64;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.2s ease;
            background-color: transparent;
        }

        .cell.correct {
            background-color: var(--correct-color) !important;
            border-color: var(--correct-color) !important;
        }

        .cell.present {
            background-color: var(--present-color) !important;
            border-color: var(--present-color) !important;
        }

        .cell.absent {
            background-color: var(--absent-color) !important;
            border-color: var(--absent-color) !important;
        }

        .message {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            min-height: 25px;
            text-align: center;
            max-width: 90%;
        }

        .keyboard {
            display: flex;
            flex-direction: column;
            gap: 3px;
            width: 100%;
            max-width: 500px;
            margin-top: auto;
            padding-bottom: 10px;
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 4px;
            width: 100%;
        }

        .key {
            background-color: #455a64;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 14px 0;
            flex: 1;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            text-align: center;
            text-transform: uppercase;
            touch-action: manipulation;
        }

        .key:active, .key:hover {
            background-color: #546e7a;
        }

        .key.wide {
            flex: 1.8;
            font-size: 0.9rem;
            background-color: #7f8c8d;
        }
    </style>
</head>
<body>

    <h1>Lingo</h1>
    <div class="subtitle">sozluk.gov.tr Tabanlı Yarışma Modu</div>

    <div class="status-container">
        <div class="status-item" id="progress-display">Kelime: 1/10</div>
        <div class="status-item" id="score-display">Doğru: 0</div>
        <button id="new-game-btn" onclick="startFullContest()" disabled>Yeni Yarışma</button>
    </div>

    <!-- Kelimelerin yazılacağı grid burasıdır -->
    <div class="game-board" id="board"></div>
    
    <div class="message" id="message-display"></div>

    <div class="keyboard">
        <div class="keyboard-row">
            <button class="key" onclick="handleInput('E')">E</button>
            <button class="key" onclick="handleInput('R')">R</button>
            <button class="key" onclick="handleInput('T')">T</button>
            <button class="key" onclick="handleInput('Y')">Y</button>
            <button class="key" onclick="handleInput('U')">U</button>
            <button class="key" onclick="handleInput('I')">I</button>
            <button class="key" onclick="handleInput('İ')">İ</button>
            <button class="key" onclick="handleInput('O')">O</button>
            <button class="key" onclick="handleInput('Ö')">Ö</button>
            <button class="key" onclick="handleInput('P')">P</button>
        </div>
        <div class="keyboard-row">
            <button class="key" onclick="handleInput('A')">A</button>
            <button class="key" onclick="handleInput('S')">S</button>
            <button class="key" onclick="handleInput('D')">D</button>
            <button class="key" onclick="handleInput('F')">F</button>
            <button class="key" onclick="handleInput('G')">G</button>
            <button class="key" onclick="handleInput('Ğ')">Ğ</button>
            <button class="key" onclick="handleInput('H')">H</button>
            <button class="key" onclick="handleInput('J')">J</button>
            <button class="key" onclick="handleInput('K')">K</button>
            <button class="key" onclick="handleInput('L')">L</button>
            <button class="key" onclick="handleInput('Ş')">Ş</button>
        </div>
        <div class="keyboard-row">
            <button class="key wide" onclick="handleInput('ENTER')">ENTER</button>
            <button class="key" onclick="handleInput('Z')">Z</button>
            <button class="key" onclick="handleInput('X')">X</button>
            <button class="key" onclick="handleInput('C')">C</button>
            <button class="key" onclick="handleInput('Ç')">Ç</button>
            <button class="key" onclick="handleInput('V')">V</button>
            <button class="key" onclick="handleInput('B')">B</button>
            <button class="key" onclick="handleInput('N')">N</button>
            <button class="key" onclick="handleInput('M')">M</button>
            <button class="key" onclick="handleInput('Ü')">Ü</button>
            <button class="key wide" onclick="handleInput('BACKSPACE')">SİL</button>
        </div>
    </div>

    <script>
        const wordPool = {
            4: ["ANIT", "ACAR", "BATI", "DOĞU", "KALE", "YURT", "KURT", "YAZI", "KATI", "İLKE", "ÜLKE", "ALÇI", "ADIM", "AŞÇI", "AFİŞ", "AŞIK", "BAKİ", "BLOK", "CİLA", "ÇAPA", "DERE", "EKİN", "GIDA", "İDOL", "İMGE", "İVME", "KREM", "LİSE", "MART", "OCAK", "ÖYKÜ", "RANT", "SARI", "TAHT", "UZAY", "VALE", "VETO"],
            5: ["KALEM", "KAVUN", "YAZAR", "MİRAS", "KİTAP", "DENİZ", "DÜNYA", "GÜNEŞ", "BAHAR", "EFKÂR", "TUTKU", "ZAMAN", "CEVİZ", "DAİRE", "EMLAK", "FESİH", "LİMAN", "MANTI", "NİMET", "OTİZM", "RADYO", "SEHPA", "SİREN", "EKSEN", "İSKAN", "İRONİ", "İNCİR", "İZMİR", "İPTAL", "İSRAF", "MESAİ", "SİVRİ", "BİBER", "KİLİM", "MİKRO"],
            6: ["BELLEK", "KÜLTÜR", "TÜRKÇE", "MİLLET", "GAYRET", "HAZİNE", "SANATÇI", "SİSTEM", "ADALET", "TENEKE", "VİCDAN", "SÖZLÜK", "GÖZLÜK", "REHBER", "MİMARİ", "TAYYAR", "İSTİFA", "İHANET", "İLETKİ", "MİTRAL", "DİREKT"],
            7: ["KAPANIŞ", "KILAVUZ", "ANADOLU", "AKADEMİ", "BELGELİ", "YETENEK", "FELSEFE", "BAŞARAN", "İSTİSNA", "İKTİSAT", "MİLLİYET", "ÇELİŞKİ", "DİNAMİK", "DİPLOMA"]
        };

        let contestWords = []; 
        let currentWordIndex = 0; 
        let correctCount = 0; 

        let secretWord = "";
        let wordLength = 5;
        const maxAttempts = 5;
        let currentAttempt = 0;
        let currentGuess = "";
        let gameOver = false;
        let waitingForNext = false; 

        // DOM elementlerini global scope'ta tutuyoruz ama atamayı yükleme sonrasında yapacağız
        let board, messageDisplay, progressDisplay, scoreDisplay, newGameBtn;

        function turkceBuyut(text) {
            let herfMap = { 'i': 'İ', 'ş': 'Ş', 'ğ': 'Ğ', 'ç': 'Ç', 'ı': 'I', 'ö': 'Ö', 'ü': 'Ü' };
            return text.split('').map(char => herfMap[char] || char.toUpperCase()).join('');
        }

        function getRandomWordsFromPool(length, count) {
            let shuffled = [...wordPool[length]].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, count);
        }

        function startFullContest() {
            contestWords = [];
            currentWordIndex = 0;
            correctCount = 0;
            gameOver = false;
            waitingForNext = false;
            if(newGameBtn) newGameBtn.disabled = true;

            let words4 = getRandomWordsFromPool(4, 3);
            let words5 = getRandomWordsFromPool(5, 3);
            let words6 = getRandomWordsFromPool(6, 3);
            let words7 = getRandomWordsFromPool(7, 1);

            contestWords = [...words4, ...words5, ...words6, ...words7];

            updateStatusDisplays();
            loadCurrentWord();
        }

        function loadCurrentWord() {
            secretWord = contestWords[currentWordIndex];
            wordLength = secretWord.length;
            currentAttempt = 0;
            currentGuess = "";
            waitingForNext = false;
            if(messageDisplay) messageDisplay.innerText = "";
            
            updateStatusDisplays();
            buildBoard();
        }

        function updateStatusDisplays() {
            if(progressDisplay) progressDisplay.innerText = `Kelime: ${currentWordIndex + 1}/10`;
            if(scoreDisplay) scoreDisplay.innerText = `Doğru: ${correctCount}`;
        }

        function buildBoard() {
            if (!board) return;
            board.innerHTML = "";
            for (let i = 0; i < maxAttempts; i++) {
                const row = document.createElement("div");
                row.className = "row";
                for (let j = 0; j < wordLength; j++) {
                    const cell = document.createElement("div");
                    cell.className = "cell";
                    cell.id = `cell-${i}-${j}`;
                    
                    // Lingo Kuralı: İlk satırda ilk harf gri ipucu olarak görünür
                    if (i === 0 && j === 0) {
                        cell.innerText = secretWord[0];
                        cell.style.color = "#7f8c8d";
                    }
                    row.appendChild(cell);
                }
                board.appendChild(row);
            }
        }

        function handleInput(input) {
            if (gameOver || waitingForNext) return;

            if (input === "ENTER") {
                if (currentGuess.length === wordLength) {
                    checkGuess();
                } else {
                    showMessage(`Lütfen ${wordLength} harfli bir kelime girin!`, "#e74c3c");
                }
            } else if (input === "BACKSPACE") {
                currentGuess = currentGuess.slice(0, -1);
                updateRowDisplay();
            } else if (currentGuess.length < wordLength && input.length === 1) {
                currentGuess += input;
                updateRowDisplay();
            }
        }

        window.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                handleInput("ENTER");
            } else if (e.key === "Backspace") {
                handleInput("BACKSPACE");
            } else {
                let keyChar = e.key;
                if (keyChar.length === 1 && /[a-zA-ZçğıiöşüÇĞIİÖŞÜ]/.test(keyChar)) {
                    handleInput(turkceBuyut(keyChar));
                }
            }
        });

        function updateRowDisplay() {
            for (let j = 0; j < wordLength; j++) {
                const cell = document.getElementById(`cell-${currentAttempt}-${j}`);
                if (!cell) continue;
                
                if (j < currentGuess.length) {
                    cell.innerText = currentGuess[j];
                    cell.style.color = "#ffffff";
                } else if (j === 0) {
                    cell.innerText = secretWord[0];
                    cell.style.color = "#7f8c8d";
                } else {
                    cell.innerText = "";
                }
            }
        }

        function checkGuess() {
            const secretLetterCount = {};
            for (let char of secretWord) {
                secretLetterCount[char] = (secretLetterCount[char] || 0) + 1;
            }

            const rowStatus = new Array(wordLength).fill("absent");

            // Yeşiller
            for (let i = 0; i < wordLength; i++) {
                if (currentGuess[i] === secretWord[i]) {
                    rowStatus[i] = "correct";
                    secretLetterCount[currentGuess[i]]--;
                }
            }

            // Sarılar
            for (let i = 0; i < wordLength; i++) {
                if (rowStatus[i] !== "correct") {
                    if (secretLetterCount[currentGuess[i]] > 0) {
                        rowStatus[i] = "present";
                        secretLetterCount[currentGuess[i]]--;
                    }
                }
            }

            // Arayüz renklendirmesi
            for (let i = 0; i < wordLength; i++) {
                const cell = document.getElementById(`cell-${currentAttempt}-${i}`);
                if (!cell) continue;
                cell.innerText = currentGuess[i];
                cell.style.color = "#ffffff";
                cell.classList.add(rowStatus[i]);
            }

            if (currentGuess === secretWord) {
                correctCount++;
                updateStatusDisplays();
                showMessage("Tebrikler! Kelimeyi bildiniz. 🎉", "#2ecc71");
                moveToNextStep();
            } else {
                currentAttempt++;
                currentGuess = "";
                
                if (currentAttempt >= maxAttempts) {
                    showMessage(`Bilemediniz! Doğru Kelime: ${secretWord} 😢`, "#e74c3c");
                    moveToNextStep();
                } else {
                    const nextFirstCell = document.getElementById(`cell-${currentAttempt}-0`);
                    if (nextFirstCell) {
                        nextFirstCell.innerText = secretWord[0];
                        nextFirstCell.style.color = "#7f8c8d";
                    }
                }
            }
        }

        function moveToNextStep() {
            waitingForNext = true;
            currentWordIndex++;

            setTimeout(() => {
                if (currentWordIndex < 10) {
                    loadCurrentWord();
                } else {
                    gameOver = true;
                    waitingForNext = false;
                    if(progressDisplay) progressDisplay.innerText = "Yarışma Bitti!";
                    showMessage(`Yarışma tamamlandı! 10 kelimenin ${correctCount} tanesini bildiniz! 🏆`, "#3498db");
                    if(newGameBtn) newGameBtn.disabled = false; 
                }
            }, 2500); 
        }

        function showMessage(msg, color) {
            if(messageDisplay) {
                messageDisplay.innerText = msg;
                messageDisplay.style.color = color;
            }
        }

        // KESİN ÇÖZÜM: Sayfadaki tüm HTML nesneleri (grid dahil) hazır olduğunda oyunu kur ve başlat
        document.addEventListener("DOMContentLoaded", () => {
            board = document.getElementById("board");
            messageDisplay = document.getElementById("message-display");
            progressDisplay = document.getElementById("progress-display");
            scoreDisplay = document.getElementById("score-display");
            newGameBtn = document.getElementById("new-game-btn");
            
            // Yarışmayı tetikle
            startFullContest();
        });
    </script>
</body>
</html>
